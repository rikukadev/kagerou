name: release-please

# sashiki と同じリリース運用: main への push ごとに Conventional Commits を
# 集計して Release PR を開き続け、マージでタグ + GitHub Release を作る。
# その後、同じ run の goreleaser job がそのタグにバイナリを append する。
#
# 2 job に分けているのは、release-please が既定の GITHUB_TOKEN で作ったタグ
# push が他の workflow を起動しないため(GitHub の再帰防止)。needs +
# release_created 出力でぶら下げる。
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
