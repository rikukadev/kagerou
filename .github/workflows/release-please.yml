name: release-please

# sashiki と同じリリース運用: main への push ごとに Conventional Commits を
# 集計して Release PR を開き続け、マージでタグ + GitHub Release を作る。
# その後、同じ run の goreleaser job がそのタグにバイナリを append する。
#
# 2 job に分けているのは、release-please が既定の GITHUB_TOKEN で作ったタグ
# push が他の workflow を起動しないため(GitHub の再帰防止)。needs +
# release_created 出力でぶら下げる。
#
# 同じ再帰防止で Release PR のブランチ push も pull_request を起こさず、
# required check が pending のままマージできなかった(毎リリース close/reopen で
# 蹴っていた)。workflow_dispatch / repository_dispatch だけは GITHUB_TOKEN 起点でも
# workflow を起動できる例外なので、kick-ci job が ci.yml をその口で起動する。
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Release PR を作った/更新したら、そのブランチで ci.yml を起動する。
  # main が動くたびに release-please がブランチを force-push してチェックが
  # stale になる問題も、これで毎回勝手に走り直すようになる。
  kick-ci:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 利用者が参照する移動メジャータグ(action@v0)を最新リリースに追従させる。
      # examples / scaffold / README は @v0 を指しており、これが無いと解決できない。
      # 軽量タグを force で貼り替えるだけ(GITHUB_TOKEN の push は他 workflow を起動しない)。
      - name: Move major tag (v0)
        run: |
          set -euo pipefail
          tag="${{ needs.release-please.outputs.tag_name }}"
          major="${tag%%.*}"   # v0.4.0 -> v0
          git tag -f "$major" "$tag"
          git push -f origin "$major"

  # npm は `npx kagerou diagnose` のための配布口。goreleaser の後に回すのは、
  # postinstall が Release の tar.gz を取りに行くため(資産が無いと初回 install が
  # 失敗する)。
  #
  # 認証は Trusted Publishing(OIDC)。長生きする publish トークンを
  # リポジトリに置かずに済む。npmjs.com 側でこの workflow を信頼する設定を
  # した後に有効になるので、それまでは変数で止めておく。
  npm-publish:
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.release_created == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC と provenance の署名に要る
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing は npm 11.5.1 以降。Node 22 同梱は 10.x なので上げる
      - run: npm install -g npm@latest
      - run: npm publish --access public
        working-directory: npm
