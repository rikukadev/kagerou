name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  # go.mod が宣言する **最低バージョン**でもビルド/テストが通ることを確かめる。
  # これが無いと、新しい toolchain で tidy するたび最低要求が黙って上がり、
  # 古い Go の利用者が go install できなくなる(#153 がそれ)。
  go-min-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: gomin
        run: echo "version=$(grep '^go ' go.mod | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.gomin.outputs.version }}
      # setup-go が入れた toolchain をそのまま使う(GOTOOLCHAIN=local で
      # 新しいものを勝手に取りに行かせない = 検証にならなくなるため)
      - env:
          GOTOOLCHAIN: local
        run: |
          go version
          go build ./...
          go test ./...

  # squash タイトルがそのまま変更履歴になるので、中身より「見えない」type を
  # 選んでいたら止める。CONTRIBUTING に書いただけでは 3 回とも止まらなかった
  # (#157 / #174 / #200 はどれもリリース後に手でノートへ追記した)。
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json commits --jq '.commits[].messageHeadline' \
            | ./.github/scripts/check-pr-title.sh "$TITLE"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # moto server に対する AWS 結合テスト(DESIGN.md §9 の第2層)
  test-aws:
    runs-on: ubuntu-latest
    services:
      moto:
        image: motoserver/moto:latest
        ports:
          - 5000:5000
    env:
      AWS_ENDPOINT_URL: http://127.0.0.1:5000
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./internal/driver/...

  # ─────────────────────────────────────────────
  # 実 AWS の E2E。構成ごとに 1 本ずつ、毎 PR で本物を作って壊す。
  #
  # test-aws(moto)では見えないものを見るための枠。実際にこれで踏んだ種類:
  #   - IAM の過不足(スタック作成前に呼ばれる API、Transform 自体の ARN、タグ伝播)
  #   - 中身の入った S3 バケットがあると DeleteStack が失敗する
  #   - post_up → readiness の順序
  # どれも「動かしてみるまで分からない」ので、モックでは代替できない。
  #
  # fork からの PR では OIDC の資格情報が渡らないので動かない。
  # required check にしてあるため、fork PR はそのままではマージできない
  # (信頼できる変更は同一リポジトリのブランチに持ってきて回す)。
  # ─────────────────────────────────────────────
  # 直列化しない。環境名を run id で採るので同時に走っても衝突せず、
  # 排他が要る共有リソースも無い(ECR のタグは内容由来、SAM の管理スタックは
  # この 2 つの構成では使わない)。
  #
  # 逆にリポジトリ全体の concurrency group を張ると、**main への push が
  # PR の required check をキャンセルする**。required にした途端、
  # 誰かがマージするたびに他の PR がマージ不能になる。
  e2e-aws-3tier:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # **この PR のコード**で検証する。リリース済みバイナリではない。
      - run: go build -o bin/kagerou ./cmd/kagerou

      # 環境名は run id 由来。再実行で衝突せず、残骸が出ても由来を追える。
      - name: Run E2E
        env:
          NAME: e2e-3t-${{ github.run_id }}
        run: ./e2e/aws/run.sh bin/kagerou e2e/aws/3tier/kagerou.yaml "$NAME"

      # run.sh も trap で片付けるが、スクリプトごと落ちた場合(構文エラー等)は
      # そこも動かない。課金と名前の衝突を残さないための最後の網。
      # pre_down が壊れているとここも失敗し得るので、|| true で握る。
      - name: Clean up
        if: always()
        env:
          NAME: e2e-3t-${{ github.run_id }}
        run: ./bin/kagerou down --name "$NAME" --config e2e/aws/3tier/kagerou.yaml || true

  # 複数サービス(A は B/C を呼び、SPA が 3 つ全部を叩く)。compute が
  # 1 個の構成では出ない問題を見る: サービス間の URL 受け渡し(CFN 参照)、
  # 全サービスの CORS 許可、ready の意味。
  e2e-aws-multi:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: go build -o bin/kagerou ./cmd/kagerou

      - name: Run E2E
        env:
          NAME: e2e-mlt-${{ github.run_id }}
        run: ./e2e/aws/run.sh bin/kagerou e2e/aws/multi/kagerou.yaml "$NAME"

      - name: Clean up
        if: always()
        env:
          NAME: e2e-mlt-${{ github.run_id }}
        run: ./bin/kagerou down --name "$NAME" --config e2e/aws/multi/kagerou.yaml || true

  # 非同期ワーカー(API → SQS → worker → DynamoDB、#119)。
  # URL を持たない compute が初登場する構成。readiness は API の 200 しか
  # 見ないので、worker が動くかは verify がジョブを流して確かめる。
  e2e-aws-worker:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: go build -o bin/kagerou ./cmd/kagerou

      - name: Run E2E
        env:
          NAME: e2e-wrk-${{ github.run_id }}
        run: ./e2e/aws/run.sh bin/kagerou e2e/aws/worker/kagerou.yaml "$NAME"

      - name: Clean up
        if: always()
        env:
          NAME: e2e-wrk-${{ github.run_id }}
        run: ./bin/kagerou down --name "$NAME" --config e2e/aws/worker/kagerou.yaml || true

  # HTTP API + VPC Link → Cloud Map → ECS Fargate(#105)。既存 4 本と違って
  # **compute が Lambda でない**唯一の経路で、ここにしか出ない壊れ方がある:
  # Cloud Map のレコードが A だとデプロイは成功して 503 になる(cfn-lint も通る)。
  #
  # VPC とサブネットはアカウント固有なのでリポジトリに書けない。既定 VPC を
  # その場で引く(読み取りのみ)。既定 VPC が無いアカウントでは vars で渡す。
  e2e-aws-apigw:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: go build -o bin/kagerou ./cmd/kagerou

      # VPC Link・名前空間・クラスタは共有ベース(e2e/aws/apigw/base.yaml)の
      # 持ち物で、1 回だけデプロイして置いてある。環境側はそれを SSM から読む。
      # per-env で VPC Link を作っていた頃は、削除が InternalFailure で転んで
      # required check が flaky だった
      - name: Run E2E
        env:
          NAME: e2e-apigw-${{ github.run_id }}
        run: ./e2e/aws/run.sh bin/kagerou e2e/aws/apigw/kagerou.yaml "$NAME"

      # Fargate は動いている間ずっと課金される。取りこぼすと TTL まで回り続ける
      - name: Clean up
        if: always()
        env:
          NAME: e2e-apigw-${{ github.run_id }}
        run: ./bin/kagerou down --name "$NAME" --config e2e/aws/apigw/kagerou.yaml || true

  # 共有 ALB 入口(#131 以降 compute: lambda の既定)。ELBv2 のリソース作成と
  # {{resolve:ssm}} の解決を、実 AWS で通るところまで見る(#175)。
  #
  # ベースは **この job が作って壊す**。常設すると月 $18 前後の固定費になるが、
  # run ごとなら数分ぶんで済む。残った状態のおかげで通ることも無くなる。
  e2e-aws-alb:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o bin/kagerou ./cmd/kagerou

      # ベース作成は **デプロイロールの仕事ではない**。ALB / SG / SSM を作る権限は
      # 生成器が出さないので、デプロイロールに足すと drift 番人が extra で落ちる
      # (missing だけでなく extra でも失敗する)。本番でもベースは特権的な一度きりの
      # 作業なので、権限の境界をそのまま fixture に写す。
      # このロールに付けているポリシーは e2e/aws/alb/base-setup-policy.json。
      # run ごとの名前空間(下)に合わせて prefix で許可しているので、名前の
      # 付け方を変えるならあちらも直すこと
      - name: Assume the base-setup role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_E2E_BASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve the VPC for the ALB
        id: vpc
        run: |
          set -euo pipefail
          VPC="${{ vars.E2E_VPC_ID }}"
          SUBNETS="${{ vars.E2E_SUBNET_IDS }}"
          if [ -z "$VPC" ]; then
            VPC=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true \
              --query 'Vpcs[0].VpcId' --output text)
          fi
          if [ -z "$SUBNETS" ]; then
            # internet-facing ALB は 2 AZ 以上を要求する
            SUBNETS=$(aws ec2 describe-subnets --filters Name=vpc-id,Values="$VPC" \
              --query 'Subnets[:2].SubnetId' --output text | tr '\t' ',')
          fi
          [ -n "$VPC" ] && [ "$VPC" != "None" ] || { echo "::error::no VPC"; exit 1; }
          echo "vpc=$VPC" >> "$GITHUB_OUTPUT"
          echo "subnets=$SUBNETS" >> "$GITHUB_OUTPUT"

      # SSM の契約パスは project ごと。fixture は 1 つの名前を直書きしているので、
      # そのままだと並行する run が互いのベースを上書きする。**直列化すると
      # 待機中の run が cancelled になり、本当の失敗が埋もれる**(#210)ので、
      # 名前のほうを run ごとに分ける。
      #
      # 動的参照({{resolve:ssm:…}})はパラメータで組み立てられないため、
      # テンプレートの文字列を置換するしかない。置換は 1 語だけに閉じてある。
      - name: Give this run its own base namespace
        id: ns
        run: |
          set -euo pipefail
          PROJECT="kagerou-e2e-alb-${{ github.run_id }}"
          sed -i "s/kagerou-e2e-alb/$PROJECT/g" \
            e2e/aws/alb/template.yaml e2e/aws/alb/kagerou.yaml
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # 環境スタックが {{resolve:ssm}} で読む先。これが無いと up は解決に失敗する
      - name: Deploy the shared ALB base
        run: |
          aws cloudformation deploy \
            --template-file e2e/aws/alb/base.yaml \
            --stack-name "${{ steps.ns.outputs.project }}-base" \
            --parameter-overrides \
              Project="${{ steps.ns.outputs.project }}" \
              VpcId=${{ steps.vpc.outputs.vpc }} \
              SubnetIds=${{ steps.vpc.outputs.subnets }} \
            --no-fail-on-empty-changeset

      # 環境の作成からは通常のデプロイロール。**生成器が出す最小権限のまま**で
      # 通ることが、この fixture の検証項目そのもの
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run E2E
        env:
          NAME: e2e-alb-${{ github.run_id }}
          KAGEROU_E2E_ALB_PROJECT: ${{ steps.ns.outputs.project }}
        run: ./e2e/aws/run.sh bin/kagerou e2e/aws/alb/kagerou.yaml "$NAME"

      - name: Clean up the environment
        if: always()
        env:
          NAME: e2e-alb-${{ github.run_id }}
        run: ./bin/kagerou down --name "$NAME" --config e2e/aws/alb/kagerou.yaml || true

      # ALB は動いている間ずっと課金される。環境を消した後に、ベース作成の
      # ロールに戻して確実に壊す
      - name: Assume the base-setup role to tear the base down
        if: always()
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_E2E_BASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Clean up the base
        if: always()
        run: |
          # ns より前で落ちるとベースは作られていない。空の名前で叩くと
          # 「消し損ねた」のか「そもそも無い」のかがログで区別できなくなる
          BASE="${{ steps.ns.outputs.project }}"
          [ -n "$BASE" ] || { echo "base was never created; nothing to delete"; exit 0; }
          aws cloudformation delete-stack --stack-name "$BASE-base" || true
          aws cloudformation wait stack-delete-complete --stack-name "$BASE-base" || true

  e2e-aws-ssr:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # arm64 イメージ(template の Architectures)をネイティブでビルドする
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - run: go build -o bin/kagerou ./cmd/kagerou

      # イメージを ECR へ push し、ImageUri を書き換えたテンプレートを作る。
      # この経路(ビルド成果物がテンプレートに焼き込まれる)は 3 層側に無い。
      - name: Build and package image
        run: |
          set -euo pipefail
          sam build --template e2e/aws/ssr/template.yaml
          sam package \
            --image-repository "${{ vars.E2E_ECR_REPOSITORY }}" \
            --output-template-file packaged-ssr.yaml

      - name: Run E2E
        env:
          NAME: e2e-ssr-${{ github.run_id }}
          # kagerou.yaml は生テンプレートを指している(offline で iam-policy が
          # 回せるように)。実デプロイは sam package の成果物で行う(#135)
          KAGEROU_TEMPLATE: packaged-ssr.yaml
        run: ./e2e/aws/run.sh bin/kagerou e2e/aws/ssr/kagerou.yaml "$NAME"

      - name: Clean up
        if: always()
        env:
          NAME: e2e-ssr-${{ github.run_id }}
        run: ./bin/kagerou down --name "$NAME" --config e2e/aws/ssr/kagerou.yaml || true

  # 既知の脆弱性チェック。advisory 運用(必須 check にしない)は sashiki と同じ理由
  # npm パッケージは「手元では動くが tarball に入っていない」が起きやすい。
  # ルートの .gitignore(bin/)に wrapper ごと巻き込まれて publish 直前に気づいた
  # ことがあるので、git 管理下のファイルだけの checkout で中身を検査する。
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check packed contents
        working-directory: npm
        run: |
          set -euo pipefail
          node --check kagerou.js
          node --check install.js
          files=$(npm pack --dry-run --json | jq -r '.[0].files[].path' | sort)
          echo "$files"
          for want in kagerou.js install.js package.json README.md; do
            echo "$files" | grep -qx "$want" || { echo "::error::$want が tarball に無い"; exit 1; }
          done
          # bin に指定したファイルが実在すること(npm は warn にしかしない)
          bin=$(node -p "require('./package.json').bin.kagerou")
          test -f "$bin" || { echo "::error::bin $bin が無い"; exit 1; }

  # E2E のデプロイロールに attach しているポリシー(e2e/aws/ci-policy.json)が、
  # 生成器の出す最小ポリシーと一致しているかを見る。**穴を踏む → 手で足す →
  # 動く → 生成器は知らないまま**、というループを止めるための番人(#135)。
  #
  # 4 fixture は 1 本のロールを共有しているので、単独の構成と比べると
  # 「他の構成にだけ要る権限」が全部 extra として出る。--config を並べて
  # 生成側を和集合にすることで、本当に見たい missing が埋もれないようにする。
  iam-policy-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check attached policy against the generated minimal set
        run: |
          go run ./cmd/kagerou iam-policy \
            --config e2e/aws/3tier/kagerou.yaml \
            --config e2e/aws/ssr/kagerou.yaml \
            --config e2e/aws/multi/kagerou.yaml \
            --config e2e/aws/worker/kagerou.yaml \
            --config e2e/aws/apigw/kagerou.yaml \
            --config e2e/aws/alb/kagerou.yaml \
            --template e2e/aws/alb/base.yaml \
            --template e2e/aws/apigw/base.yaml \
            --check e2e/aws/ci-policy.json

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # go.mod の**最低**バージョンではなく最新で回す。govulncheck 自身が
      # 新しい Go を要求する(v1.8.0 は go >= 1.26)ので、最低バージョンに
      # 揃えるとスキャンに入る前の go install で落ちる。
      # 脆弱性の有無は toolchain のバージョンで変わる話ではない
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
