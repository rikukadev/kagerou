name: kagerou
description: >
  Ephemeral environments on AWS — composite action that runs kagerou up/down from CI.
  Configure AWS credentials (aws-actions/configure-aws-credentials etc.) before this step.
inputs:
  name:
    description: Environment name (e.g. pr-42). Required for up/down, unused for reap
    required: false
    default: ""
  down:
    description: "'true' to delete the environment (otherwise up)"
    default: "false"
  reap:
    description: "'true' to reap environments past their TTL (no name needed)"
    default: "false"
  grace:
    description: Grace period for reap (e.g. 1h); expired environments are kept this long
    default: ""
  comment:
    description: "'true' to upsert the URL comment on the PR (pull_request events only)"
    default: "true"
  config:
    description: Path to kagerou.yaml
    default: kagerou.yaml
  ttl:
    description: Lifetime (e.g. 72h / none); empty falls back to kagerou.yaml
    default: ""
  env:
    description: Env vars for the app (KEY=VALUE, one per line)
    default: ""
  param:
    description: Template parameters (KEY=VALUE, one per line)
    default: ""
  version:
    description: >
      kagerou version to use (e.g. v0.1.0). The default "latest" downloads
      the newest release binary.
    default: latest
  ref:
    description: >
      When set, version is ignored and this ref is installed via go install
      (for trying unreleased main or a PR; slower because Go builds it).
    default: ""
  github_token:
    description: Token used for the PR comment
    default: ${{ github.token }}
outputs:
  url:
    description: URL of the environment
    value: ${{ steps.run.outputs.url }}
  state:
    description: Environment state (CONTRACT §3)
    value: ${{ steps.run.outputs.state }}
runs:
  using: composite
  steps:
    # 既定はリリース済みバイナリの取得。go install だと CI のたびに Go の
    # ビルドが走り(数十秒)、さらに ref=main では日によって別物が入る。
    - name: Install kagerou (release binary)
      if: inputs.ref == ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
        esac
        ver="$VERSION"
        if [ "$ver" = "latest" ]; then
          # latest のリダイレクト先から実際の版を取る(資産名に版が入るため)
          ver=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            https://github.com/rikukadev/kagerou/releases/latest | sed 's#.*/tag/##')
          if [ -z "$ver" ]; then
            echo "could not resolve the latest release; set version explicitly or use ref" >&2
            exit 1
          fi
        fi
        case "$ver" in
          v*) ;;
          *) echo "could not resolve the latest release (no releases yet?): $ver" >&2
             echo "set version explicitly or use ref (go install)" >&2
             exit 1 ;;
        esac
        asset="kagerou_${ver#v}_linux_${arch}.tar.gz"
        url="https://github.com/rikukadev/kagerou/releases/download/${ver}/${asset}"
        echo "installing kagerou ${ver} (${asset})"
        # self-hosted runner は /usr/local/bin に書けないことがあるため RUNNER_TEMP に置く
        bin="${RUNNER_TEMP}/kagerou-bin"
        mkdir -p "$bin"
        tmp=$(mktemp -d)
        curl -fsSL "$url" -o "$tmp/k.tar.gz"
        tar -xzf "$tmp/k.tar.gz" -C "$tmp"
        install -m 755 "$tmp/kagerou" "$bin/kagerou"
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/kagerou" version

    # ref 指定時のみ go install(未リリースの main や PR を試す用)
    - uses: actions/setup-go@v7
      if: inputs.ref != ''
      with:
        go-version: stable
        cache: false
    - name: Install kagerou (from source)
      if: inputs.ref != ''
      shell: bash
      run: |
        # self-hosted runner は ~/go/bin が PATH に無いことがあるため置き場を固定する
        export GOBIN="${RUNNER_TEMP}/kagerou-bin"
        mkdir -p "$GOBIN"
        go install github.com/rikukadev/kagerou/cmd/kagerou@${{ inputs.ref }}
        echo "$GOBIN" >> "$GITHUB_PATH"
        "$GOBIN/kagerou" version

    - name: Run kagerou
      id: run
      shell: bash
      env:
        IN_NAME: ${{ inputs.name }}
        IN_DOWN: ${{ inputs.down }}
        IN_REAP: ${{ inputs.reap }}
        IN_GRACE: ${{ inputs.grace }}
        IN_CONFIG: ${{ inputs.config }}
        IN_TTL: ${{ inputs.ttl }}
        IN_ENV: ${{ inputs.env }}
        IN_PARAM: ${{ inputs.param }}
      run: |
        set -euo pipefail
        if [ "$IN_REAP" = "true" ]; then
          rargs=(--config "$IN_CONFIG")
          [ -n "$IN_GRACE" ] && rargs+=(--grace "$IN_GRACE")
          kagerou reap "${rargs[@]}"
          exit 0
        fi
        if [ -z "$IN_NAME" ]; then
          echo "::error::name is required for up / down" >&2
          exit 1
        fi
        args=(--name "$IN_NAME" --config "$IN_CONFIG")
        [ -n "$IN_TTL" ] && args+=(--ttl "$IN_TTL")
        while IFS= read -r kv; do
          [ -n "$kv" ] && args+=(--env "$kv")
        done <<< "$IN_ENV"
        while IFS= read -r kv; do
          [ -n "$kv" ] && args+=(--param "$kv")
        done <<< "$IN_PARAM"

        if [ "$IN_DOWN" = "true" ]; then
          kagerou down "${args[@]}"
          exit 0
        fi

        # PR イベントなら出自を URI 形式で記録(CONTRACT §1 kagerou:source)
        if [ -n "${GITHUB_EVENT_NAME:-}" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          pr=$(jq -r .pull_request.number "$GITHUB_EVENT_PATH")
          args+=(--source "github_pr://$GITHUB_REPOSITORY/$pr")
        fi

        out=$(kagerou up "${args[@]}" --output json)
        echo "$out"
        echo "url=$(echo "$out" | jq -r '.url // ""')" >> "$GITHUB_OUTPUT"
        echo "state=$(echo "$out" | jq -r .state)" >> "$GITHUB_OUTPUT"
        echo "expires_at=$(echo "$out" | jq -r '.expires_at // "none"')" >> "$GITHUB_OUTPUT"

    - name: Comment preview URL (idempotent)
      if: inputs.down != 'true' && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        NAME: ${{ inputs.name }}
        URL: ${{ steps.run.outputs.url }}
        EXPIRES: ${{ steps.run.outputs.expires_at }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        marker="<!-- kagerou:${NAME} -->"
        body="${marker}
        ## 🌫 Preview environment

        | | |
        |---|---|
        | URL | ${URL:-(no URL output)} |
        | Environment | \`${NAME}\` |
        | Expires | ${EXPIRES} |

        When the PR closes or the TTL expires, the environment vanishes like a heat shimmer."
        existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
          --jq "[.[] | select(.body | startswith(\"${marker}\"))][0].id" 2>/dev/null || true)
        if [ -n "$existing" ] && [ "$existing" != "null" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" > /dev/null
        fi
