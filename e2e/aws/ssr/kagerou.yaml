# 実 AWS E2E(SSR 側)。名前は CI が --name で渡す。
project: kagerou-e2e
driver: stack
# sam package の出力(ImageUri が書き換わったもの)を使う。
template: packaged-ssr.yaml
region: ap-northeast-1
name_prefix: kge2e-
ttl: 2h

env:
  KAGEROU_ENV: "{name}"
  GREETING: "hello from {name}"

# この構成は post_up が要らない(1 つの Lambda が最初から応答する)。
# 3 層側との違いがここに出る。
readiness_path: "/"
readiness_timeout: 120s
