# 実 AWS E2E(共有 ALB 入口 → Lambda 版)。名前は CI が --name で渡す。
#
# project は他の fixture と揃える。これは kagerou:project タグにしかならず、
# **ベースの SSM 契約パスとは無関係**(あちらは template.yaml の
# {{resolve:ssm}} と base.yaml の Project パラメータで決まり、CI が run ごとに
# ずらす)。揃えておかないと夜間 sweep の reap が拾えない(#219)。
# fixture 同士はスタック名の name_prefix で分かれる。
project: kagerou-e2e
driver: stack
template: e2e/aws/alb/template.yaml
region: ap-northeast-1
name_prefix: kge2e-alb-
# Lambda はアイドル $0 だが、ALB は動いている間ずっと課金される。
# ベースごと job が壊すので、取りこぼしの保険として短くしておく
ttl: 2h

env:
  KAGEROU_ENV: "{name}"
  GREETING: "hello from {name}"

# ALB に Lambda ターゲットを登録してから通るまで少し待つ。
# ここを待たずに down すると「作れたが通らない」構成を緑にしてしまう
readiness_path: "/"
readiness_timeout: 180s
