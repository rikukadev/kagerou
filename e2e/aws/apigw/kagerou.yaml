# 実 AWS E2E(HTTP API + VPC Link → ECS 版)。名前は CI が --name で渡す。
project: kagerou-e2e
driver: stack
template: e2e/aws/apigw/template.yaml
region: ap-northeast-1
name_prefix: kge2e-
# Fargate は動いている間ずっと課金される。E2E は使い捨てなので短く
ttl: 2h

env:
  KAGEROU_ENV: "{name}"
  GREETING: "hello from {name}"

hooks:
  # Cloud Map のサービスは、登録インスタンスが残っていると削除できない。
  # ECS サービスを消しても **登録解除は非同期で遅れる**ので、先にタスクを
  # 落として止まりきるまで待つ(CONTRACT §7 の「やらないと削除が失敗する前処理」)。
  #
  # **冪等にすること。** pre_down が失敗すると down ごと中止されるので、
  # 部分削除された状態(クラスタやサービスが既に無い)で落ちると、
  # kagerou から回復できなくなる — 実際にそれで詰まらせた。
  pre_down: |
    set -eu
    cluster="${KAGEROU_OUTPUT_CLUSTERNAME:-}"
    service="${KAGEROU_OUTPUT_SERVICENAME:-}"
    if [ -z "$cluster" ] || [ -z "$service" ]; then
      echo "pre_down: cluster/service の Output が無い。何もしない"
      exit 0
    fi
    # 既に消えている / クラスタが inactive なら、drain するものが無い
    active=$(aws ecs describe-services --cluster "$cluster" --services "$service" \
      --query 'services[0].status' --output text 2>/dev/null || echo NONE)
    if [ "$active" != "ACTIVE" ]; then
      echo "pre_down: service は $active。drain 不要"
      exit 0
    fi
    aws ecs update-service --cluster "$cluster" --service "$service" \
      --desired-count 0 >/dev/null
    aws ecs wait services-stable --cluster "$cluster" --services "$service"

# タスクの起動 + Cloud Map への登録 + VPC Link の反映で、200 が返るまで
# Lambda より明確に遅い。ここを待たずに down すると「作れたが通らない」構成を
# 緑にしてしまう(この fixture が確かめたいのはまさにそこ)
readiness_path: "/"
readiness_timeout: 420s
