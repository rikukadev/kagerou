AWSTemplateFormatVersion: "2010-09-09"
# 実 AWS E2E: HTTP API + VPC Link → Cloud Map → ECS Fargate(#105 / #169)。
#
#   Browser ──→ HTTP API ──VPC Link──→ Cloud Map (SRV) ──→ Fargate タスク
#
# 既存 4 fixture との違いは **compute が Lambda でない**こと。この経路には
# Lambda では出ない失敗が 2 つあり、どちらも cfn-lint は通る:
#
#   1. Cloud Map の DnsRecords が A だと VPC Link 統合は繋がらない。**SRV が要る**
#   2. SRV にはポートが要るので、ECS の ServiceRegistries に ContainerName と
#      ContainerPort を付けないとタスクを登録できない
#
# 「デプロイは成功するのに 503 が返る」形で出るので、テンプレートを読んでも
# 気づけない。実際に叩くところまでやる意味があるのはそこ。
#
# VPC Link・名前空間・クラスタ・SG は **共有ベース**(e2e/aws/apigw/base.yaml)の
# 持ち物で、環境は Cloud Map サービス・ECS サービス・HTTP API だけ作る。
#
# 最初は 1 スタックで自己完結させていたが、**per-env の VPC Link は削除が転ぶ**
# (CI で InternalFailure。required check が flaky になった)うえ、kagerou 自身が
# 生成しない構成でもある。製品の apigwbase.yaml.tmpl に合わせた。
#
# イメージはビルドしない(public ECR の busybox が env を返す)。
Description: kagerou real-AWS E2E, HTTP API + VPC Link -> Cloud Map -> ECS Fargate

Parameters:
  EnvKagerouEnv:
    Type: String
  EnvGreeting:
    Type: String
    Default: ""
  # ベースが SSM に書いた値。動的参照は Fn::Split の中で展開されないので、
  # サブネットだけは SSM パラメータ型で受ける(#169 と同じ理由)
  BaseSubnets:
    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>>
    Default: /kagerou/base/kagerou-e2e/apigw_subnets

Resources:
  DiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      # 名前空間はベースの持ち物で **全環境で共有** される。ここを固定名にすると
      # 2 本目の環境が AlreadyExists で作れない(製品の雛形も環境名を使っている)
      Name: !Ref EnvKagerouEnv
      NamespaceId: "{{resolve:ssm:/kagerou/base/kagerou-e2e/apigw_namespace_id}}"
      DnsConfig:
        DnsRecords:
          # ここが A だとデプロイは通るが 503 になる。SRV でなければならない
          - Type: SRV
            TTL: 10
        RoutingPolicy: MULTIVALUE
      # 環境は消える。登録解除を待たせない
      HealthCheckCustomConfig:
        FailureThreshold: 1

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/kagerou/${EnvKagerouEnv}"  # ecs 雛形と同じ規約
      RetentionInDays: 1

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "kge2e-${EnvKagerouEnv}"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: app
          # ビルドしない。確かめたいのは結線であってイメージの作り方ではない
          Image: public.ecr.aws/docker/library/busybox:1.37
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - { Name: KAGEROU_ENV, Value: !Ref EnvKagerouEnv }
            - { Name: GREETING, Value: !Ref EnvGreeting }
          # env が中まで届いていることを応答で確かめられるようにする
          Command:
            - sh
            - -c
            - >-
              mkdir -p /www &&
              printf '{"service":"apigw-ecs","env":"%s","greeting":"%s"}' "$KAGEROU_ENV" "$GREETING" > /www/index.html &&
              httpd -f -p 8080 -h /www
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    Properties:
      Cluster: "{{resolve:ssm:/kagerou/base/kagerou-e2e/apigw_cluster}}"
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          # public サブネット + public IP。NAT を立てずに public ECR を引く
          AssignPublicIp: ENABLED
          Subnets: !Ref BaseSubnets
          SecurityGroups: ["{{resolve:ssm:/kagerou/base/kagerou-e2e/apigw_task_security_group}}"]
      ServiceRegistries:
        # SRV にはコンテナとポートが要る。落とすと登録できない
        - RegistryArn: !GetAtt DiscoveryService.Arn
          ContainerName: app
          ContainerPort: 8080

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "kge2e-${EnvKagerouEnv}"
      ProtocolType: HTTP

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId: "{{resolve:ssm:/kagerou/base/kagerou-e2e/apigw_vpc_link_id}}"
      IntegrationUri: !GetAtt DiscoveryService.Arn
      PayloadFormatVersion: "1.0"

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub "integrations/${Integration}"

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

Outputs:
  KagerouUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ClusterName:
    Value: "{{resolve:ssm:/kagerou/base/kagerou-e2e/apigw_cluster}}"
  ServiceName:
    Value: !GetAtt Service.Name
  DiscoveryServiceId:
    Value: !GetAtt DiscoveryService.Id
