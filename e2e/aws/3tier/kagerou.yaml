# 実 AWS E2E(3 層側)。名前は CI が --name で渡す。
project: kagerou-e2e
driver: stack
template: e2e/aws/3tier/template.yaml
region: ap-northeast-1
# IAM ロールはこの接頭辞の範囲だけに絞ってある。変えるならロールも変える。
name_prefix: kge2e-
# 片付けに失敗しても長居させない。reap の最後の網が効く長さ。
ttl: 2h

env:
  KAGEROU_ENV: "{name}"
  # --env が Env<Key> パラメータ経由でアプリまで届くかを、応答で確かめる。
  GREETING: "hello from {name}"

hooks:
  # スタックが出来ただけでは静的配信は空で、URL を開くと 404 になる。
  # ここで中身を置いてから readiness が 200 を待つ、という順序自体が検証対象。
  post_up: |
    set -eu
    : "${KAGEROU_OUTPUT_WEBBUCKETNAME:?post_up に WebBucketName Output が届いていない}"
    printf '<!doctype html><title>%s</title><h1>%s</h1>' "$KAGEROU_NAME" "$KAGEROU_NAME" > /tmp/kge2e-index.html
    aws s3 cp /tmp/kge2e-index.html "s3://$KAGEROU_OUTPUT_WEBBUCKETNAME/index.html" \
      --content-type "text/html; charset=utf-8"

  # 中身の入ったバケットは DeleteStack が消せない。post_down では遅く
  # (そのときスタックはもう無く、バケット名も引けない)、pre_down が要る。
  pre_down: |
    set -eu
    : "${KAGEROU_OUTPUT_WEBBUCKETNAME:?pre_down に WebBucketName Output が届いていない}"
    aws s3 rm "s3://$KAGEROU_OUTPUT_WEBBUCKETNAME" --recursive

  post_down: |
    set -eu
    echo "post_down ran for $KAGEROU_NAME"

readiness_path: "/"
readiness_timeout: 120s
